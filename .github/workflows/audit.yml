name: Dependency audit

# Weekly and on demand, not per push: advisories change without code changes.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit
      # Both audits read the lockfiles only; no dependency install or build is needed.
      - name: npm audit
        run: npm audit --audit-level=high
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock
