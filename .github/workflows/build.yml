name: Check and build Tauri
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Public contributions always run on disposable GitHub-hosted machines. Both platforms run
  # every check, so neither falls behind the other.
  check:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: Formatting
        run: npm run format:check && cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run check
      - run: npm run check:public
      - run: python -m unittest discover -s tests/python
      - run: npm run test:rust
      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --bin stats-service

  # Distributables only on tags or a manual run, and only after `check` passed on both platforms.
  dist:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: Linux distribution
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      # Tauri bundles every binary of the crate; Connect STRATZ relies on stats-service sitting
      # beside the app, so a bundler change must not drop it silently.
      - name: Statistics service in the packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            grep -q '/oname=stats-service.exe' src-tauri/target/release/nsis/x64/installer.nsi
          else
            # Read each listing whole before matching: under pipefail, `grep -q` closing the pipe
            # early fails the producer, and a silent failure here hides which package is wrong.
            deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
            listing=$(dpkg-deb -c "$deb")
            # dpkg-deb prints `./usr/bin/...` or `usr/bin/...` depending on how the archive was built.
            if ! grep -qE ' (\./)?usr/bin/stats-service$' <<<"$listing"; then
              echo "::error::stats-service is missing from $deb"
              echo "$listing"
              exit 1
            fi
            appimage=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage)
            (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract 'usr/bin/stats-service')
            if [ ! -x "$RUNNER_TEMP/squashfs-root/usr/bin/stats-service" ]; then
              echo "::error::stats-service is missing from $appimage"
              find "$RUNNER_TEMP/squashfs-root" -maxdepth 3 | head -40
              exit 1
            fi
          fi
      # The portable ZIP copies the executable the installer build just produced.
      - name: Windows portable ZIP
        if: runner.os == 'Windows'
        run: node scripts/package-native.mjs
      - name: Windows native smoke
        if: runner.os == 'Windows'
        run: npm run test:native
      - uses: actions/upload-artifact@v4
        with:
          name: ancient-lens-${{ runner.os }}
          path: |
            release/*-Tauri-win.zip
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  # A `v*` tag turns the distributables into a draft prerelease. Nothing is public until a
  # maintainer reviews the draft and publishes it by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ancient-lens-*
          path: artifacts
      - name: Collect files and checksums
        run: |
          mkdir upload
          # Asset names without spaces or underscores, e.g. Ancient-Lens-0.5.0-x64-setup.exe.
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "upload/$(basename "$file" | tr ' _' '--')"
          done
          cd upload
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          package=$(node -p "require('./package.json').version")
          if [ "$version" != "$package" ]; then
            echo "::error::Tag $TAG does not match package.json version $package"
            exit 1
          fi
          # The version's changelog section, without its heading.
          awk -v heading="## $version" '
            /^## / { if (found) exit; found = ($0 == heading || index($0, heading " ") == 1); next }
            found
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          { cat .github/release-notes.md; echo; echo "## Changes in $version"; cat changes.md; } > notes.md
          cat notes.md
      - name: Draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" upload/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --prerelease
          --title "Ancient Lens ${TAG#v} (prerelease)"
          --notes-file notes.md
