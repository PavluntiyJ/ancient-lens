name: Check and build Tauri
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      native-source-run:
        description: 'Native-only recheck: source run ID (leave all three empty for a full run)'
        type: string
        default: ''
      native-artifact-id:
        description: 'Native-only recheck: Windows build artifact ID from the summary'
        type: string
        default: ''
      native-source-sha:
        description: 'Native-only recheck: full source SHA from the summary'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Public contributions always run on disposable GitHub-hosted machines. Both platforms run
  # every check, so neither falls behind the other.
  check:
    if: inputs.native-source-run == '' && inputs.native-artifact-id == '' && inputs.native-source-sha == ''
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: Formatting
        run: npm run format:check && cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run check
      - run: npm run check:public
      - run: python -m unittest discover -s tests/python
      - run: npm run test:rust
      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --bin stats-service

  # Build once before packaging. A failed smoke job can reuse this exact artifact on rerun.
  native-build:
    needs: check
    timeout-minutes: 40
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.app.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build Windows application without installers
        run: npm run build
      - name: Record source revision and executable checksums
        run: node scripts/native-build-artifact.mjs create
      - uses: actions/upload-artifact@v4
        id: app
        with:
          name: native-app-Windows-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            src-tauri/target/release/ancient-lens.exe
            src-tauri/target/release/stats-service.exe
            src-tauri/target/release/native-build.json
          if-no-files-found: error
          retention-days: 7

  # Runs on PRs too. Rerun this job, not native-build, to investigate the same executable.
  native-smoke:
    needs: native-build
    if: ${{ !cancelled() && (needs.native-build.result == 'success' || inputs.native-source-run != '' || inputs.native-artifact-id != '' || inputs.native-source-sha != '') }}
    timeout-minutes: 15
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      NATIVE_SOURCE_SHA: ${{ inputs.native-source-sha || github.sha }}
      NATIVE_SOURCE_RUN: ${{ inputs.native-source-run || github.run_id }}
      NATIVE_ARTIFACT_ID: ${{ inputs.native-artifact-id || needs.native-build.outputs.artifact-id }}
      NATIVE_RECHECK_COMPLETE: ${{ (inputs.native-source-run == '' && inputs.native-artifact-id == '' && inputs.native-source-sha == '') || (inputs.native-source-run != '' && inputs.native-artifact-id != '' && inputs.native-source-sha != '') }}
    steps:
      - name: Validate source identity
        shell: pwsh
        run: |
          if ($env:NATIVE_RECHECK_COMPLETE -ne 'true' -or
              $env:NATIVE_SOURCE_SHA -notmatch '^[a-f0-9]{40}$' -or
              $env:NATIVE_SOURCE_RUN -notmatch '^[1-9][0-9]*$' -or
              $env:NATIVE_ARTIFACT_ID -notmatch '^[1-9][0-9]*$') {
            throw 'Provide a complete source run ID, artifact ID and full commit SHA.'
          }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.NATIVE_ARTIFACT_ID }}
          run-id: ${{ env.NATIVE_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: src-tauri/target/release
          merge-multiple: true
      - name: Verify reusable application
        run: node scripts/native-build-artifact.mjs verify
      - name: Native UI scenarios
        run: npm run test:native
      - name: Save native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        id: diagnostics
        with:
          name: native-diagnostics-Windows-${{ github.run_attempt }}
          path: test-results/native/
          if-no-files-found: warn
          retention-days: 7
      - name: Link diagnostics and rerun instructions
        if: always()
        shell: bash
        env:
          DIAGNOSTICS_URL: ${{ steps.diagnostics.outputs.artifact-url }}
          SOURCE_SHA: ${{ env.NATIVE_SOURCE_SHA }}
          SOURCE_RUN: ${{ env.NATIVE_SOURCE_RUN }}
          BUILD_ARTIFACT_ID: ${{ env.NATIVE_ARTIFACT_ID }}
        run: |
          {
            printf '\nWindows native check · commit `%s` · source run `%s` · build artifact `%s`\n\n' "$SOURCE_SHA" "$SOURCE_RUN" "$BUILD_ARTIFACT_ID"
            if [ -n "$DIAGNOSTICS_URL" ]; then
              printf '[Download native diagnostics](%s)\n\n' "$DIAGNOSTICS_URL"
            else
              echo 'No diagnostics were produced; check the failed setup or artifact verification step.'
            fi
            echo 'For a native-only investigation, choose **Run workflow** and fill the three native source fields above. This skips compilation and packaging. Ordinary job reruns reuse the build too, but GitHub also reruns dependent packaging jobs on tag/full manual runs. Artifacts expire after seven days; after expiry a new build is required.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Distributables only on tags/manual runs, after checks and the independent native gate.
  dist:
    if: inputs.native-source-run == '' && inputs.native-artifact-id == '' && inputs.native-source-sha == '' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    needs: [check, native-build, native-smoke]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm
      - run: npm ci
      - name: Linux distribution
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Download tested Windows application
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.native-build.outputs.artifact-id }}
          path: src-tauri/target/release
          merge-multiple: true
      - name: Verify tested Windows application
        if: runner.os == 'Windows'
        run: node scripts/native-build-artifact.mjs verify
      - name: Windows installer
        if: runner.os == 'Windows'
        run: npx tauri bundle --bundles nsis
      # Tauri bundles every binary of the crate; Connect STRATZ relies on stats-service sitting
      # beside the app, so a bundler change must not drop it silently.
      - name: Statistics service in the packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            grep -q '/oname=stats-service.exe' src-tauri/target/release/nsis/x64/installer.nsi
          else
            # Read each listing whole before matching: under pipefail, `grep -q` closing the pipe
            # early fails the producer, and a silent failure here hides which package is wrong.
            deb=$(ls src-tauri/target/release/bundle/deb/*.deb)
            listing=$(dpkg-deb -c "$deb")
            # dpkg-deb prints `./usr/bin/...` or `usr/bin/...` depending on how the archive was built.
            if ! grep -qE ' (\./)?usr/bin/stats-service$' <<<"$listing"; then
              echo "::error::stats-service is missing from $deb"
              echo "$listing"
              exit 1
            fi
            rpm=$(ls src-tauri/target/release/bundle/rpm/*.rpm)
            listing=$(rpm -qpl "$rpm")
            if ! grep -qx '/usr/bin/stats-service' <<<"$listing"; then
              echo "::error::stats-service is missing from $rpm"
              echo "$listing"
              exit 1
            fi
            appimage=$(ls "$PWD"/src-tauri/target/release/bundle/appimage/*.AppImage)
            (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract 'usr/bin/stats-service')
            if [ ! -x "$RUNNER_TEMP/squashfs-root/usr/bin/stats-service" ]; then
              echo "::error::stats-service is missing from $appimage"
              find "$RUNNER_TEMP/squashfs-root" -maxdepth 3 | head -40
              exit 1
            fi
          fi
      # The portable ZIP copies the executable the installer build just produced.
      - name: Windows portable ZIP
        if: runner.os == 'Windows'
        run: node scripts/package-native.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ancient-lens-${{ runner.os }}
          path: |
            release/*-Tauri-win.zip
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  # A `v*` tag turns the distributables into a draft prerelease. Nothing is public until a
  # maintainer reviews the draft and publishes it by hand.
  release:
    if: inputs.native-source-run == '' && inputs.native-artifact-id == '' && inputs.native-source-sha == '' && startsWith(github.ref, 'refs/tags/v')
    needs: dist
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ancient-lens-*
          path: artifacts
      - name: Collect files and checksums
        run: |
          mkdir upload
          # Asset names without spaces or underscores, e.g. Ancient-Lens-0.5.0-x64-setup.exe.
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "upload/$(basename "$file" | tr ' _' '--')"
          done
          cd upload
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          package=$(node -p "require('./package.json').version")
          if [ "$version" != "$package" ]; then
            echo "::error::Tag $TAG does not match package.json version $package"
            exit 1
          fi
          # The version's changelog section, without its heading.
          awk -v heading="## $version" '
            /^## / { if (found) exit; found = ($0 == heading || index($0, heading " ") == 1); next }
            found
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          { cat .github/release-notes.md; echo; echo "## Changes in $version"; cat changes.md; } > notes.md
          cat notes.md
      - name: Draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" upload/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --prerelease
          --title "Ancient Lens ${TAG#v} (prerelease)"
          --notes-file notes.md
