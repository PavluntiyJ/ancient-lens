name: Check and build Tauri
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Public contributions always run on disposable GitHub-hosted machines.
  check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      - name: Formatting
        run: npm run format:check && cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: npm run check
      - run: npm run check:public
      - run: python3 -m unittest discover -s tests/python
      - run: npm run build:web
      - run: npm run test:rust
      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features --bin stats-service

  # Distributables and the Windows build only on tags or a manual run.
  dist:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: npm ci
      # Tauri embeds the web build when the crate compiles, so it must exist first.
      - name: Windows Rust tests
        if: runner.os == 'Windows'
        run: npm run build:web && npm run test:rust
      - name: Linux distribution
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Windows distribution
        if: runner.os == 'Windows'
        run: npm run dist:win:zip
      - name: Windows native smoke
        if: runner.os == 'Windows'
        run: npm run test:native
      - uses: actions/upload-artifact@v4
        with:
          name: ancient-lens-${{ runner.os }}
          path: |
            release/*-Tauri-win.zip
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
