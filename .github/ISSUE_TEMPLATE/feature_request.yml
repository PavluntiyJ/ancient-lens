name: Feature request
description: Propose something Ancient Lens should do.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: Features must stay within the fair-play boundary in CONTRIBUTING.md (no input to the game, no hidden information, no game modification).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen. Mention the data source if the feature shows new numbers.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      options:
        - Windows and Linux
        - Windows
        - Linux
    validations:
      required: true
