version: 2
# Minor and patch updates arrive as one grouped pull request per ecosystem; a major version
# gets its own pull request because it may need code changes. Security updates are separate
# and not limited by these settings.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # The type definitions follow the Node major the project builds with (22 in CI).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      cargo-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # zbus 6 drops the blocking API the shortcut portal uses, and the Tauri single-instance
      # plugin still pulls zbus 5; move together once Tauri's plugins use zbus 6.
      - dependency-name: zbus
        update-types: ['version-update:semver-major']
  # Raises the pinned compiler in rust-toolchain.toml; CI then runs Clippy and the tests on it.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
